/* Dados (CSV local incorporado), regras de negócio e apresentação: nenhuma chamada de rede. */
const $ = (selector, root=document) => root.querySelector(selector);
const $$ = (selector, root=document) => Array.from(root.querySelectorAll(selector));
const ICON = (name,extra='') => `<svg class="icon ${extra}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const escapeHTML = (value) => String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const brl = cents => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(cents/100);
const normalize = s => String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

/* Parser RFC-4180 simplificado: suporta vírgulas, aspas duplicadas e quebras de linha entre aspas. */
function parseCSV(csv){
  let rows=[], row=[], field='', inside=false;
  const input=String(csv).replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  for(let i=0;i<input.length;i++){
    const c=input[i];
    if(c==='"') { if(inside&&input[i+1]==='"'){field+='"';i++;} else inside=!inside; }
    else if(c===','&&!inside){row.push(field);field='';}
    else if(c==='\n'&&!inside){row.push(field); if(row.some(x=>x!==''))rows.push(row);row=[];field='';}
    else field+=c;
  }
  if(field!==''||row.length){row.push(field);rows.push(row);}
  const [header,...data]=rows;
  if(!header) return [];
  return data.map(cells=>Object.fromEntries(header.map((key,i)=>[key,cells[i]??''])));
}

const fallbackStorage={};
function storageGet(key,session=false){
  try {const st=session?window.sessionStorage:window.localStorage;return st.getItem(key)??fallbackStorage[key]??null;}
  catch {return fallbackStorage[key]??null;}
}
function storageSet(key,value,session=false){
  fallbackStorage[key]=value;
  try{(session?window.sessionStorage:window.localStorage).setItem(key,value);}catch{}
}
function storageRemove(key,session=false){
  delete fallbackStorage[key];
  try{(session?window.sessionStorage:window.localStorage).removeItem(key);}catch{}
}
function loadJSON(key,backup){try{return JSON.parse(storageGet(key))??backup;}catch{return backup;}}
const state={user:null,screen:'login',category:'Todos os livros',search:'',sort:'relevancia',maxPrice:'todos',onlyFavorites:false,cart:{},favorites:[],shipping:'economico',payment:'pix',address:null};
function userKey(resource){return `foliario:v1:${resource}:${state.user.id}`;}
function loadUserData(){
  let saved=loadJSON(userKey('carrinho'),{});
  state.cart=Object.fromEntries(Object.entries(saved).filter(([id,qty])=>byId.has(id)&&Number.isInteger(qty)&&qty>0&&qty<=99));
  let fav=loadJSON(userKey('favoritos'),[]);
  state.favorites=Array.isArray(fav)?fav.filter(id=>byId.has(id)):[];
  state.address=null;state.shipping='economico';state.payment='pix';
}
function saveCart(){storageSet(userKey('carrinho'),JSON.stringify(state.cart));updateHeader();}
function saveFavorites(){storageSet(userKey('favoritos'),JSON.stringify(state.favorites));updateHeader();}
function activeCart(){return Object.entries(state.cart).map(([id,qty])=>({book:byId.get(id),qty})).filter(item=>item.book&&item.qty>0);}
function quantityTotal(){return activeCart().reduce((sum,item)=>sum+item.qty,0);}
function subtotal(){return activeCart().reduce((sum,item)=>sum+item.qty*item.book.price,0);}
function currentTotal(){return subtotal()+RATES[state.shipping];}
function isFavorite(id){return state.favorites.includes(id);}
function openScreen(screen){
  if(!state.user)screen='login';
  if(screen==='checkout'&&!activeCart().length)screen='cart';
  state.screen=screen;render();window.scrollTo(0,0);
}
function login(email,password){
  const user=users.find(u=>normalize(u.email)===normalize(email.trim())&&u.senha===password);
  if(!user)return false;
  state.user=user;storageSet('foliario:v1:session',user.id,true);loadUserData();state.search='';state.category='Todos os livros';state.onlyFavorites=false;openScreen('catalog');return true;
}
function logout(){state.user=null;state.screen='login';state.cart={};state.favorites=[];storageRemove('foliario:v1:session',true);closeModal(false);render();}
function addBook(id){
  if(!state.user||!byId.has(id))return;
  state.cart[id]=Math.min(99,(state.cart[id]||0)+1);saveCart();notify(`“${byId.get(id).titulo}” foi adicionado ao carrinho.`);
}
function changeQuantity(id,delta){
  if(!state.cart[id])return;
  state.cart[id]=Math.min(99,Math.max(1,state.cart[id]+delta));saveCart();render();
}
function removeItem(id){delete state.cart[id];saveCart();render();notify('Livro removido do carrinho.');}
function toggleFavorite(id){
  if(!byId.has(id))return;
  state.favorites=isFavorite(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];saveFavorites();
  const active=$(`[data-action="favorite"][data-id="${id}"]`);
  if(active){active.classList.toggle('is-favorite',isFavorite(id));active.setAttribute('aria-label',isFavorite(id)?'Remover dos favoritos':'Adicionar aos favoritos');active.setAttribute('aria-pressed',String(isFavorite(id)));}
  if(state.onlyFavorites)updateResults();
  notify(isFavorite(id)?'Livro salvo nos favoritos.':'Livro retirado dos favoritos.');
}
function filteredBooks(){
  let result=books.filter(b=>(state.category==='Todos os livros'||state.category===b.categoria)
    &&(!state.onlyFavorites||isFavorite(b.id))
    &&(!state.search||normalize(b.titulo+' '+b.autores).includes(normalize(state.search)))
    &&(state.maxPrice==='todos'||b.price<=Number(state.maxPrice)));
  if(state.sort==='titulo')result.sort((a,b)=>a.titulo.localeCompare(b.titulo,'pt-BR'));
  if(state.sort==='preco')result.sort((a,b)=>a.price-b.price);
  if(state.sort==='avaliacao')result.sort((a,b)=>b.rating-a.rating);
  return result;
}

}

function openModal(content,success=false){focusBeforeModal=document.activeElement;modalIsSuccess=success;$('#modal-layer').innerHTML=`<div class="modal-backdrop" data-action="dismiss-backdrop"><section class="modal-panel ${success?'success-modal':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><button class="modal-close" data-action="close-modal" aria-label="Fechar janela">${ICON('x')}</button>${content}</section></div>`;document.body.style.overflow='hidden';$('.modal-close').focus();}
function closeModal(goToCatalog=false){$('#modal-layer').innerHTML='';document.body.style.overflow='';const was=modalIsSuccess;modalIsSuccess=false;if(was&&goToCatalog){state.onlyFavorites=false;state.category='Todos os livros';state.search='';state.maxPrice='todos';state.sort='relevancia';openScreen('catalog');}else if(focusBeforeModal&&typeof focusBeforeModal.focus==='function'&&document.contains(focusBeforeModal))focusBeforeModal.focus();}
function notify(message){const el=$('#toast');el.innerHTML=`${ICON('check')}<span>${escapeHTML(message)}</span>`;el.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000);}
function confirmCheckout(){
  const form=$('#checkout-form');if(!form)return;
  // `novalidate` permite emitir nossa mensagem em vez do balão padrão.
  if(!form.checkValidity()){form.reportValidity();notify('Verifique os campos obrigatórios do endereço.');return;}
  const items=activeCart();if(!items.length){openScreen('cart');notify('O carrinho está vazio.');return;}
  const fd=new FormData(form);const delivery={};for(const k of ['endereco','complemento','bairro','cidade','estado','cep'])delivery[k]=String(fd.get(k)||'').trim();
  if(['endereco','bairro','cidade','estado','cep'].some(k=>!delivery[k])){notify('Preencha o endereço de entrega.');return;}
  state.address=delivery;state.shipping=fd.get('frete')==='expresso'?'expresso':'economico';state.payment=['pix','credito','boleto'].includes(fd.get('pagamento'))?fd.get('pagamento'):'pix';
  const total=currentTotal(),sh=RATES[state.shipping],sub=subtotal();
  const orderId=`FOL-${new Date().toISOString().slice(0,10).replace(/-/g,'')}-${Math.floor(10000+Math.random()*90000)}`;
  const snapshot=items.map(({book:b,qty})=>({book:b,qty}));
  state.cart={};saveCart();
  const paymentLabel={pix:'PIX',credito:'Cartão de crédito',boleto:'Boleto bancário'}[state.payment];
  openModal(`<div class="success-emblem">${ICON('check')}</div><div class="eyebrow">Confirmação de demonstração</div><h2 id="dialog-title">Uma ótima escolha!</h2><p class="muted">Seu pedido fictício foi registrado com sucesso nesta sessão.</p><div class="success-order-id">Identificação: <strong>${orderId}</strong> · ${paymentLabel}</div><div class="warning"><strong>Pedido simulado — nenhuma compra ou cobrança foi realizada</strong></div><div class="success-books">${snapshot.map(({book:b,qty})=>`<div class="success-book"><img src="${b.capa}" alt="Capa de ${escapeHTML(b.titulo)}"><div><strong>${escapeHTML(b.titulo)}</strong><span>${qty} ${qty===1?'exemplar':'exemplares'} · ${brl(b.price*qty)}</span></div></div>`).join('')}</div><div class="sum-line"><span>Produtos</span><strong>${brl(sub)}</strong></div><div class="sum-line"><span>Frete (${state.shipping==='economico'?'econômico':'expresso'})</span><strong>${brl(sh)}</strong></div><div class="success-total">Total demonstrativo: <strong>${brl(total)}</strong></div><button class="app-button full" data-action="finish-order">Continuar comprando ${ICON('arrow')}</button>`,true);
}
function render(){const app=$('#app');if(!state.user){app.innerHTML=renderLogin();return;}app.innerHTML=state.screen==='cart'?renderCart():state.screen==='checkout'?renderCheckout():renderCatalog();}

/* Delegação centralizada: todos os botões são operantes; nenhum handler remoto. */
document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
  const action=button.dataset.action,id=button.dataset.id;
  if(action==='dismiss-backdrop'&&event.target!==button)return;
  switch(action){
    case 'fill-account':{const user=users.find(u=>u.id===id);if(user){$('#login-email').value=user.email;$('#login-password').value=user.senha;$('#login-error').textContent='';$('#login-email').focus();}break;}
    case 'show-password':{const el=$('#login-password');el.type=el.type==='password'?'text':'password';button.setAttribute('aria-label',el.type==='password'?'Mostrar senha':'Ocultar senha');break;}
    case 'logout':logout();break;
    case 'nav-catalog':state.onlyFavorites=false;openScreen('catalog');break;
    case 'nav-favorites':state.onlyFavorites=true;state.category='Todos os livros';state.search='';openScreen('catalog');break;
    case 'nav-cart':openScreen('cart');break;
    case 'nav-checkout':openScreen('checkout');break;
    case 'category':state.category=button.dataset.category;openScreen('catalog');break;
    case 'reset-filters':state.category='Todos os livros';state.search='';state.onlyFavorites=false;state.sort='relevancia';state.maxPrice='todos';openScreen('catalog');break;
    case 'detail':detailBook(id);break;
    case 'favorite':toggleFavorite(id);break;
    case 'favorite-detail':toggleFavorite(id);detailBook(id);break;
    case 'add':addBook(id);break;
    case 'add-detail':addBook(id);closeModal(false);break;
    case 'increment':changeQuantity(id,1);break;
    case 'decrement':changeQuantity(id,-1);break;
    case 'remove':removeItem(id);break;
    case 'close-modal':closeModal(modalIsSuccess);break;
    case 'dismiss-backdrop':closeModal(modalIsSuccess);break;
    case 'finish-order':closeModal(true);break;
  }
});
document.addEventListener('submit',event=>{
  if(event.target.id==='login-form'){event.preventDefault();const mail=$('#login-email').value.trim(),pwd=$('#login-password').value;const error=$('#login-error');if(!mail||!pwd){error.textContent='Informe o e-mail e a senha de demonstração.';return;}if(!login(mail,pwd)){error.textContent='Credenciais não encontradas. Confira o e-mail e a senha.';}return;}
  if(event.target.id==='checkout-form'){event.preventDefault();confirmCheckout();}
});
document.addEventListener('input',event=>{
  if(event.target.id==='catalog-search'){state.search=event.target.value;updateResults();}
  if(event.target.id==='login-email'||event.target.id==='login-password'){const err=$('#login-error');if(err)err.textContent='';}
});
document.addEventListener('change',event=>{
  if(event.target.id==='price-filter'){state.maxPrice=event.target.value;updateResults();}
  if(event.target.id==='sort-filter'){state.sort=event.target.value;updateResults();}
  if(event.target.name==='frete'){state.shipping=event.target.value==='expresso'?'expresso':'economico';const el=$('#checkout-summary');if(el)el.innerHTML=checkoutSummary();}
  if(event.target.name==='pagamento')state.payment=event.target.value;
});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&$('#modal-layer').firstChild){event.preventDefault();closeModal(modalIsSuccess);return;}
  if(event.key==='Tab'&&$('#modal-layer').firstChild){const focusables=$$('button:not(:disabled),[href],input:not(:disabled),select:not(:disabled)', $('#modal-layer'));if(!focusables.length)return;const first=focusables[0],last=focusables[focusables.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
});
function boot(){const sessionId=storageGet('foliario:v1:session',true);const saved=users.find(u=>u.id===sessionId);if(saved){state.user=saved;state.screen='catalog';loadUserData();}render();}
boot();

</script>
